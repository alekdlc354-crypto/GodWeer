name: Build Mod

on:
  push:
    # main — обычные сборки; ветка сессии — чтобы можно было собрать
    # jar прямо из неё (workflow_dispatch недоступен боту).
    branches: [ main, 'arena/3752399b-godweer' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          set +e
          ./gradlew build --no-daemon --stacktrace > build.log 2>&1
          code=$?
          set -e
          echo "gradle exit code: $code"
          if [ $code -ne 0 ]; then
            grep -n -A4 -i -E "error:|what went wrong" build.log | head -80 | cut -c1-2500 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            echo "----- last 120 lines of build.log -----"
            tail -120 build.log
          fi
          exit $code

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: GodWeer-Phone
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      # Готовый .jar выкладывается релизом: ссылка открывается без логина
      # и не требует лезть в артефакты Actions. main получает build-<run>,
      # ветка сессии — test-<run>, старые test-* удаляются, чтобы не копились.
      - name: Publish release with JAR
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/3752399b-godweer')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            tag="build-${GITHUB_RUN_NUMBER}"
          else
            tag="test-${GITHUB_RUN_NUMBER}"
          fi
          echo "publishing $jar as $tag"

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            # Оставляем два последних test-релиза. set +e: пустой grep не должен валить шаг.
            set +e
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
              | grep -E '^test-[0-9]+$' | sort -t- -k2 -n | head -n -2 \
              | while read -r old; do
                  gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
                done
            set -e
          fi

          gh release create "$tag" "$jar" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Phone-Sosiski — сборка ${GITHUB_RUN_NUMBER}" \
            --notes "Автосборка мода. Ветка: \`${GITHUB_REF_NAME}\`, коммит: \`${GITHUB_SHA}\`.

          Как поставить:
          1. Скачать \`$(basename "$jar")\` из Assets ниже.
          2. Положить в папку \`mods\` вашего Minecraft 26.3 (Fabric Loader 0.19.5+, Fabric API 0.163.0+26.3)." \
            --prerelease
