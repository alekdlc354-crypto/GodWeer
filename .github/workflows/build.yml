name: Build Mod

on:
  push:
    branches: [arena/105465d2-godweer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          set +e
          ./gradlew build --no-daemon --stacktrace > build.log 2>&1
          code=$?
          set -e
          echo "gradle exit code: $code"
          grep -n -A4 -i -E "error:|what went wrong" build.log | head -60 | cut -c1-2500 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit $code

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: GodWeer-Phone
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
